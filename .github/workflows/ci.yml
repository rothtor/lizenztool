name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reusable so publish-docker.yml and deploy-railway.yml can gate on the
  # exact same test job instead of duplicating it.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Syntax check
        run: python -m compileall -q lizenztool

      - name: Run tests
        run: pytest -q
